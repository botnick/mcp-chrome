name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/hangwin/mcp-chrome.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commits ahead"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-edit || true

      - name: Check for conflicts
        if: steps.check.outputs.behind != '0'
        id: conflicts
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U | wc -l)
          echo "count=$CONFLICTS" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICTS" -gt 0 ]; then
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
          fi

      - name: Auto-resolve fork-only files
        if: steps.check.outputs.behind != '0' && steps.conflicts.outputs.count != '0'
        run: |
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              app/chrome-extension/entrypoints/styles/glass/*|\
              app/chrome-extension/components/glass/*|\
              scripts/quick-install.ps1|\
              FORK_SYNC.md)
                echo "Auto-resolving (keep ours): $f"
                git checkout --ours "$f"
                git add "$f"
                ;;
            esac
          done

      - name: Push and create PR
        if: steps.check.outputs.behind != '0'
        run: |
          git push origin "${{ env.branch }}"

      - name: Create Pull Request
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHIND=${{ steps.check.outputs.behind }}
          CONFLICTS=${{ steps.conflicts.outputs.count }}

          BODY="Syncing $BEHIND commits from upstream (hangwin/mcp-chrome)."
          if [ "$CONFLICTS" -gt 0 ]; then
            BODY="$BODY

          **$CONFLICTS conflict(s) need manual resolution.**
          Fork-only files (glass/*, quick-install.ps1) were auto-resolved.

          Remaining conflicts are likely translation-related.
          Use \`git checkout --ours <file>\` for files where only
          Chinese comments changed."
          else
            BODY="$BODY

          No conflicts — ready to merge."
          fi

          gh pr create \
            --title "chore: sync upstream ($BEHIND commits)" \
            --body "$BODY" \
            --base master \
            --head "${{ env.branch }}"
